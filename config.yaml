name: Claude Assistant
version: "0.3.0"
slug: claude_assistant
description: Claude Code CLI Integration for Home Assistant - No API costs, uses Claude Pro tokens
url: https://github.com/anthropics/claude-code
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
init: false
startup: application
boot: auto
hassio_api: true
hassio_role: default
homeassistant_api: true
host_network: false
ingress: true
ingress_port: 8099
panel_icon: mdi:robot
panel_title: Claude Chat
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: Claude Assistant API
options:
  log_level: "info"
  enable_image_analysis: true
  claude_credentials: ""
schema:
  log_level: list(debug|info|warning|error)
  enable_image_analysis: bool
  claude_credentials: password?
map:
  - media:rw
  - share:rw
  - config:ro
