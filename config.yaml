name: Claude Assistant
version: "0.1.0"
slug: claude_assistant
description: Claude Code CLI Integration for Home Assistant with image analysis
url: https://github.com/anthropics/claude-code
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
init: false
startup: application
boot: auto
hassio_api: true
hassio_role: default
homeassistant_api: true
host_network: false
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: Claude Assistant API
options:
  anthropic_api_key: ""
  log_level: "info"
  enable_image_analysis: true
schema:
  anthropic_api_key: str
  log_level: list(debug|info|warning|error)
  enable_image_analysis: bool
image: ghcr.io/local/claude-assistant
map:
  - media:rw
  - share:rw
  - config:ro
